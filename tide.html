<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#10243a"><title>Maritime Tools | Tide & Tide Height</title>
<style>
:root{color-scheme:dark;--bg:#0b1724;--panel:#14283c;--line:#29445d;--text:#edf5fc;--muted:#a9bdcf;--accent:#54c6d5}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0b1724,#102b40);color:var(--text);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}main{max-width:900px;margin:auto;padding:25px 16px 45px}h1{font-size:clamp(1.5rem,5vw,2.1rem);margin:0}.muted,.note{color:var(--muted)}.note{font-size:.85rem}.panel{background:rgba(20,40,60,.94);border:1px solid var(--line);border-radius:16px;padding:18px;margin:14px 0}.top{display:flex;justify-content:space-between;gap:10px;align-items:center}a{color:var(--accent)}label{display:block;color:var(--muted);font-size:.9rem;margin-bottom:6px}input,select,button{width:100%;padding:12px;border:1px solid var(--line);border-radius:9px;background:#0b1b2b;color:var(--text);font:inherit}button{background:#1b6572;cursor:pointer;font-weight:650}button:disabled{opacity:.6;cursor:wait}.fields{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:12px}.fields>div{min-width:0}.meta{display:flex;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:.88rem}.chart{width:100%;overflow-x:auto}.chart svg{width:100%;min-width:560px;height:auto;display:block}.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.card{background:#0d2031;border-radius:12px;padding:12px}.card b{display:block;font-size:1.2rem}table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{text-align:left;padding:9px;border-bottom:1px solid var(--line)}th{color:var(--muted)}#status{min-height:25px}#results[hidden]{display:none}@media(max-width:650px){.fields{grid-template-columns:1fr 1fr}.fields>div:first-child{grid-column:1/-1}.cards{grid-template-columns:1fr}.panel{padding:14px}}
</style></head><body><main>
<div class="top"><div><h1 id="title">潮汐与潮高查询</h1><div class="muted" id="subtitle">Maritime Tools · 官方预测数据</div></div><select id="lang" aria-label="Language" style="width:auto"><option value="zh">中文</option><option value="en">English</option></select></div>
<nav class="panel"><a href="index.html" id="back">← Beaufort 风力换算</a></nav>
<section class="panel"><div class="fields"><div><label for="port" id="portLabel">港口 / 潮位站</label><select id="port"><option value="8518750">New York · The Battery</option><option value="9410660">Los Angeles · Los Angeles Harbor</option><option value="8670870">Savannah · Fort Pulaski</option><option value="9410170">San Diego · San Diego Bay</option><option value="other">Singapore / Rotterdam / Melbourne / Port Klang (待接入)</option></select></div><div><label for="date" id="dateLabel">查询日期</label><input id="date" type="date"></div><div><label for="unit" id="unitLabel">高度单位</label><select id="unit"><option value="metric">m</option><option value="english">ft</option></select></div><div><label>&nbsp;</label><button id="search">查询</button></div></div><p class="note" id="coverage">当前支持 NOAA 美国潮位站。其他港口待接入授权数据源，无法查询时不会生成模拟潮高。</p><div id="status" role="status" aria-live="polite"></div></section>
<section id="results" hidden><div class="panel"><div class="meta"><span id="source"></span><span id="timezone"></span><span id="datum"></span><span id="cache"></span></div><h2 id="chartTitle">每30分钟预测潮高</h2><div class="chart" id="chart"></div></div><div class="panel"><div class="cards"><div class="card"><span id="highLabel">最高预测潮高</span><b id="high"></b></div><div class="card"><span id="lowLabel">最低预测潮高</span><b id="low"></b></div><div class="card"><span id="rangeLabel">当日潮差</span><b id="range"></b></div></div><h2 id="eventsTitle">高潮与低潮 (HW / LW)</h2><div style="overflow-x:auto"><table><thead><tr><th id="typeHead">类型</th><th id="timeHead">港口当地时间</th><th id="heightHead">潮高</th></tr></thead><tbody id="events"></tbody></table></div></div></section>
<p class="note" id="warning">航海安全提示：本页为 NOAA 预测潮位，仅供辅助参考。潮高基准为 MLLW，不能与其他海图基准直接混用。实际潮位可能受气象影响。航行、进出港及 UKC 计算须核对官方潮汐资料、海图基准及船舶 SMS。</p>
</main><script>
const $=id=>document.getElementById(id);const API='https://api.tidesandcurrents.noaa.gov/api/prod/datagetter';
const dict={zh:{title:'潮汐与潮高查询',subtitle:'Maritime Tools · 官方预测数据',back:'← Beaufort 风力换算',portLabel:'港口 / 潮位站',dateLabel:'查询日期',unitLabel:'高度单位',search:'查询',coverage:'当前支持 NOAA 美国潮位站。其他港口待接入授权数据源，无法查询时不会生成模拟潮高。',chartTitle:'每30分钟预测潮高',highLabel:'最高预测潮高',lowLabel:'最低预测潮高',rangeLabel:'当日潮差（最高值减最低值）',eventsTitle:'高潮与低潮 (HW / LW)',typeHead:'类型',timeHead:'港口当地时间',heightHead:'潮高',warning:'航海安全提示：本页为 NOAA 预测潮位，仅供辅助参考。潮高基准为 MLLW，不能与其他海图基准直接混用。实际潮位可能受气象影响。航行、进出港及 UKC 计算须核对官方潮汐资料、海图基准及船舶 SMS。',loading:'正在查询 NOAA 官方数据…',noport:'该港口尚未接入可靠数据源，无法提供潮高。',failed:'查询失败。请检查网络、日期及 NOAA 服务状态。',empty:'该日期没有可用预测数据。',offline:'离线缓存数据',online:'NOAA 实时获取',high:'高潮 HW',low:'低潮 LW',none:'当日无可用高低潮事件',time:'时间采用港口当地时间（含夏令时）',source:'数据：NOAA Tides & Currents',datum:'基准：MLLW',bad:'数据格式异常，未显示潮高。'},en:{title:'Tide & Tide Height Predictor',subtitle:'Maritime Tools · Official predictions',back:'← Beaufort wind converter',portLabel:'Port / tide station',dateLabel:'Prediction date',unitLabel:'Height unit',search:'Search',coverage:'Currently supports selected U.S. NOAA stations. Other ports require licensed data sources; no synthetic tide heights are generated.',chartTitle:'Predicted tide height every 30 minutes',highLabel:'Highest predicted height',lowLabel:'Lowest predicted height',rangeLabel:'Daily range (maximum minus minimum)',eventsTitle:'High and low water (HW / LW)',typeHead:'Type',timeHead:'Port local time',heightHead:'Height',warning:'Navigation safety: NOAA predicted heights are advisory. Datum is MLLW; do not interchange with other chart datums. Weather can change observed water levels. Verify official tidal publications, chart datum and vessel SMS before navigation, port entry or UKC calculations.',loading:'Requesting official NOAA data…',noport:'No reliable data source is connected for this port.',failed:'Request failed. Check connectivity, date and NOAA service status.',empty:'No predictions available for this date.',offline:'Cached data',online:'Fetched from NOAA',high:'High water HW',low:'Low water LW',none:'No HW/LW events available for this day',time:'Port local time (daylight saving applied)',source:'Source: NOAA Tides & Currents',datum:'Datum: MLLW',bad:'Invalid source data. No heights displayed.'}};
let current=null;function t(){return dict[$('lang').value]}function translate(){const d=t();for(const [k,v] of Object.entries(d)){if($(k)&&k!=='high'&&k!=='low')$(k).textContent=v}if(current)render(current);}
const pad=n=>String(n).padStart(2,'0');function todayAtPort(){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());const x=Object.fromEntries(parts.map(p=>[p.type,p.value]));return `${x.year}-${x.month}-${x.day}`}
function status(s){$('status').textContent=s}function validDate(v){return /^\d{4}-\d{2}-\d{2}$/.test(v)}
async function getJSON(url,key){try{const r=await fetch(url);if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error(j.error.message||'NOAA error');localStorage.setItem(key,JSON.stringify(j));return [j,false]}catch(e){const saved=localStorage.getItem(key);if(saved)return [JSON.parse(saved),true];throw e}}
function makeURL(product,interval){const q=new URLSearchParams({begin_date:$('date').value.replaceAll('-',''),end_date:$('date').value.replaceAll('-',''),station:$('port').value,product,datum:'MLLW',time_zone:'lst_ldt',units:$('unit').value,format:'json',application:'maritime_tools'});if(interval)q.set('interval',interval);return API+'?'+q}
async function search(){const d=t();$('results').hidden=true;current=null;if($('port').value==='other'){status(d.noport);return}if(!validDate($('date').value)){status(d.failed);return}const btn=$('search');btn.disabled=true;status(d.loading);try{const u1=makeURL('predictions','30'),u2=makeURL('predictions','hilo');const [a,b]=await Promise.all([getJSON(u1,'mt-tide-'+u1),getJSON(u2,'mt-tide-'+u2)]);if(!Array.isArray(a[0].predictions)||!a[0].predictions.length)throw Error('No predictions');const points=a[0].predictions.map(x=>({time:x.t,height:Number(x.v)}));if(points.some(x=>!Number.isFinite(x.height)))throw Error('Invalid height');const events=Array.isArray(b[0].predictions)?b[0].predictions.filter(x=>Number.isFinite(Number(x.v))):[];current={points,events,cached:a[1]||b[1]};render(current);status('')}catch(e){console.warn(e);status(d.failed)}finally{btn.disabled=false}}
function render(data){const d=t(),unit=$('unit').value==='metric'?'m':'ft';$('results').hidden=false;$('source').textContent=d.source;$('datum').textContent=d.datum;$('timezone').textContent=d.time;$('cache').textContent=data.cached?d.offline:d.online;const vals=data.points.map(p=>p.height),hi=Math.max(...vals),lo=Math.min(...vals);const f=v=>v.toFixed(2)+' '+unit;$('high').textContent=f(hi);$('low').textContent=f(lo);$('range').textContent=f(hi-lo);$('events').replaceChildren();if(!data.events.length){const tr=document.createElement('tr'),td=document.createElement('td');td.colSpan=3;td.textContent=d.none;tr.append(td);$('events').append(tr)}for(const e of data.events){const tr=document.createElement('tr');for(const value of [e.type==='H'?d.high:d.low,e.t, f(Number(e.v))]){const td=document.createElement('td');td.textContent=value;tr.append(td)}$('events').append(tr)}draw(data.points,unit)}
function draw(points,unit){const w=800,h=300,l=55,r=18,top=20,b=48;let min=Math.min(...points.map(p=>p.height)),max=Math.max(...points.map(p=>p.height));if(min===max){min-=.5;max+=.5}const range=max-min, x=i=>l+i*(w-l-r)/Math.max(1,points.length-1),y=v=>top+(max-v)/range*(h-top-b);const svg=document.createElementNS('http://www.w3.org/2000/svg','svg');svg.setAttribute('viewBox',`0 0 ${w} ${h}`);svg.setAttribute('role','img');svg.setAttribute('aria-label',t().chartTitle);const el=(tag,attrs,txt)=>{const n=document.createElementNS('http://www.w3.org/2000/svg',tag);for(const [k,v] of Object.entries(attrs))n.setAttribute(k,v);if(txt!==undefined)n.textContent=txt;svg.append(n);return n};for(let i=0;i<=4;i++){const v=min+range*i/4,yy=y(v);el('line',{x1:l,x2:w-r,y1:yy,y2:yy,stroke:'#365168','stroke-dasharray':'3 5'});el('text',{x:6,y:yy+4,fill:'#a9bdcf','font-size':12},v.toFixed(2))}el('polyline',{points:points.map((p,i)=>`${x(i)},${y(p.height)}`).join(' '),fill:'none',stroke:'#54c6d5','stroke-width':3,'stroke-linejoin':'round'});for(let i=0;i<points.length;i+=Math.max(1,Math.floor(points.length/6))){el('text',{x:x(i),y:h-16,fill:'#a9bdcf','font-size':12,'text-anchor':'middle'},points[i].time.slice(11,16))}el('text',{x:l,y:13,fill:'#a9bdcf','font-size':12},unit);$('chart').replaceChildren(svg)}
$('lang').value=localStorage.getItem('mt-lang')==='en'?'en':'zh';$('date').value=todayAtPort();$('lang').addEventListener('change',()=>{localStorage.setItem('mt-lang',$('lang').value);translate()});$('search').addEventListener('click',search);$('port').addEventListener('change',()=>{$('results').hidden=true;status('')});$('unit').addEventListener('change',()=>{if(current)search()});translate();
</script></body></html>
